[project]
name = "code-thinking"
version = "0.1.0"
description = "MCP server providing thinking frameworks and workflows for LLM code reasoning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
code-thinking = "code_thinking:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_thinking"]
